# Docker Compose for Vizzly Visual Testing
# Ensures screenshots match between local development and CI
#
# Usage:
#   1. Build the Docker image (once): yarn vizzly:docker:build
#   2. Start Vizzly TDD server: yarn vizzly:tdd
#   3. Run tests in container: yarn vizzly:docker
#
# First run is slow (full build), subsequent runs use Broccoli cache.
# Edit tests/app on host, re-run yarn vizzly:docker to see changes.

services:
  visual-tests:
    image: ember-osf-vizzly
    volumes:
      # Mount source for live editing
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./mirage:/app/mirage:ro
      - ./lib:/app/lib:ro
      # Persist Broccoli cache for fast rebuilds
      - vizzly-broccoli-cache:/app/tmp
      # Persist baselines between runs
      - ./.vizzly:/app/.vizzly
    environment:
      # Point to TDD server running on host machine
      - VIZZLY_SERVER_URL=http://host.docker.internal:47392
    extra_hosts:
      # Required for Linux hosts
      - "host.docker.internal:host-gateway"
    # Shared memory for Chromium browser
    shm_size: '2gb'

volumes:
  vizzly-broccoli-cache:
